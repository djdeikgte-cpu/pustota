<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bevy WASM Demo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
        }

        #container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        canvas {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            display: block;
            margin: 0 auto;
        }

        .info {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>🎮 Bevy WASM Demo</h1>

        <!-- Canvas создастся автоматически -->
        <canvas id="bevy-canvas"></canvas>

        <div class="info">
            <p><strong>Управление:</strong> WASD или Стрелки</p>
            <p>Зелёный квадрат - игрок, Красные - враги</p>
        </div>
    </div>

    <!-- Загрузка WASM -->
    <script type="module">
        import init from './bevy_wasm_example.js';
        init();
    </script>
</body>
</html>
